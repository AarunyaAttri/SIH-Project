<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Dashboard Login</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<style>
		body {
			min-height: 100vh;
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(135deg, #0f2027, #2c5364 80%);
			overflow: hidden;
			font-family: 'Segoe UI', Arial, sans-serif;
			position: relative;
		}
		.bg-graphics {
			position: absolute;
			top: 0; left: 0; width: 100vw; height: 100vh;
			pointer-events: none;
			z-index: 0;
		}
		.glass-card {
			position: relative;
			z-index: 1;
			background: rgba(255,255,255,0.15);
			border-radius: 2rem;
			box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			border: 1.5px solid rgba(255,255,255,0.18);
			padding: 2.5rem 2rem 2rem 2rem;
			width: 350px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		.glass-card .icon {
			font-size: 2.5rem;
			color: #00e6ff;
			background: rgba(44,83,100,0.15);
			border-radius: 50%;
			padding: 0.7rem;
			margin-bottom: 0.7rem;
			box-shadow: 0 0 12px #00e6ff44;
		}
		.glass-card h1 {
			margin: 0 0 0.5rem 0;
			font-size: 2rem;
			color: #fff;
			letter-spacing: 1px;
			font-weight: 700;
			text-shadow: 0 2px 8px #0004;
		}
		.glass-card .subtext {
			color: #e0e0e0;
			font-size: 1rem;
			margin-bottom: 1.5rem;
			text-align: center;
		}
		.input-group {
			width: 100%;
			margin-bottom: 1.1rem;
			position: relative;
		}
		.input-group input {
			width: 100%;
			padding: 0.9rem 2.5rem 0.9rem 2.5rem;
			border-radius: 1.2rem;
			border: none;
			background: rgba(255,255,255,0.25);
			color: #222;
			font-size: 1rem;
			outline: none;
			box-shadow: 0 2px 8px #0001;
			transition: background 0.2s;
		}
		.input-group input:focus {
			background: rgba(255,255,255,0.4);
		}
		.input-group .input-icon {
			position: absolute;
			left: 0.9rem;
			top: 50%;
			transform: translateY(-50%);
			color: #00e6ff;
			font-size: 1.1rem;
			pointer-events: none;
		}
		.input-group .toggle-password {
			position: absolute;
			right: 0.9rem;
			top: 50%;
			transform: translateY(-50%);
			color: #888;
			font-size: 1.1rem;
			cursor: pointer;
		}
		.options {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 1.2rem;
			font-size: 0.97rem;
		}
		.toggle-switch {
			display: flex;
			align-items: center;
			cursor: pointer;
		}
		.toggle-switch input {
			display: none;
		}
		.toggle-slider {
			width: 36px;
			height: 20px;
			background: #b2fefa;
			border-radius: 12px;
			position: relative;
			margin-right: 0.5rem;
			transition: background 0.2s;
		}
		.toggle-switch input:checked + .toggle-slider {
			background: #00e6ff;
		}
		.toggle-slider:before {
			content: '';
			position: absolute;
			left: 3px;
			top: 3px;
			width: 14px;
			height: 14px;
			background: #fff;
			border-radius: 50%;
			transition: transform 0.2s;
		}
		.toggle-switch input:checked + .toggle-slider:before {
			transform: translateX(16px);
		}
		.forgot-link {
			color: #00e6ff;
			text-decoration: none;
			position: relative;
			transition: color 0.2s;
		}
		.forgot-link:hover {
			color: #fff;
		}
		.forgot-link::after {
			content: '';
			display: block;
			width: 100%;
			height: 2px;
			background: linear-gradient(90deg, #00e6ff, #8f00ff);
			position: absolute;
			left: 0; bottom: -2px;
			opacity: 0;
			transition: opacity 0.2s;
		}
		.forgot-link:hover::after {
			opacity: 1;
		}
		.login-btn {
			width: 100%;
			padding: 0.95rem;
			border: none;
			border-radius: 1.2rem;
			background: linear-gradient(90deg, #00e6ff, #8f00ff);
			color: #fff;
			font-size: 1.1rem;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 2px 8px #0002;
			margin-bottom: 0.7rem;
			transition: transform 0.15s, box-shadow 0.15s;
		}
		.login-btn:hover {
			transform: scale(1.04);
			box-shadow: 0 4px 16px #8f00ff44;
		}
		.footer {
			margin-top: 1.2rem;
			color: #b2fefa;
			font-size: 0.85rem;
			text-align: center;
			letter-spacing: 0.2px;
			opacity: 0.8;
		}
		@media (max-width: 500px) {
			.glass-card { width: 98vw; padding: 1.2rem 0.5rem; }
		}
	</style>
</head>
<body>
	<canvas class="bg-graphics"></canvas>
	<div class="glass-card">
		<div class="icon"><i class="fas fa-shield-alt"></i></div>
		<h1>Admin Dashboard</h1>
		<div class="subtext">Secure access to system management</div>
		<form autocomplete="off">
			<div class="input-group">
				<span class="input-icon"><i class="fas fa-user"></i></span>
				<input type="text" placeholder="Username or Email" required>
			</div>
			<div class="input-group">
				<span class="input-icon"><i class="fas fa-key"></i></span>
				<input type="password" placeholder="Password" id="admin-password" required>
				<span class="toggle-password" onclick="togglePassword()"><i class="fas fa-eye"></i></span>
			</div>
			<div class="options">
				<label class="toggle-switch">
					<input type="checkbox">
					<span class="toggle-slider"></span>
					Remember Me
				</label>
				<a href="#" class="forgot-link">Forgot Password?</a>
			</div>
			<button type="submit" class="login-btn">Sign In &rarr;</button>
		</form>
		<div class="footer">Authorized users only. Your activity is monitored.</div>
	</div>
	<script>
		// Glassmorphism background with floating shapes
		const canvas = document.querySelector('.bg-graphics');
		const ctx = canvas.getContext('2d');
		function resizeCanvas() {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
		}
		window.addEventListener('resize', resizeCanvas);
		resizeCanvas();
		// Draw floating shapes
		function drawShapes() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			for (let i = 0; i < 18; i++) {
				const x = Math.sin(Date.now()/1200 + i) * 120 + (canvas.width/2) + Math.cos(i)*canvas.width/3.5;
				const y = Math.cos(Date.now()/900 + i) * 80 + (canvas.height/2) + Math.sin(i)*canvas.height/3.5;
				ctx.beginPath();
				ctx.arc(x, y, 32 + 12*Math.sin(Date.now()/700 + i), 0, 2*Math.PI);
				ctx.fillStyle = `rgba(${120+Math.sin(i)*80},${200+Math.cos(i)*40},255,0.08)`;
				ctx.fill();
			}
			requestAnimationFrame(drawShapes);
		}
		drawShapes();
		// Password toggle
		function togglePassword() {
			const pwd = document.getElementById('admin-password');
			const icon = document.querySelector('.toggle-password i');
			if (pwd.type === 'password') {
				pwd.type = 'text';
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
			} else {
				pwd.type = 'password';
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
			}
		}
	</script>
</body>
</html>
