<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Attendance System</title>
    <link rel="stylesheet" href="student-login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Student Portal</h1>
                <p>Attendance Management System</p>
                <div style="background: #e8f5e8; color: #2d5a2d; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 0.9em;">
                    🎓 <strong>Student Access:</strong> Login with your student ID and password!
                </div>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group">
                    <label for="class">Class</label>
                    <select id="class" name="class" required>
                        <option value="">Select Class</option>
                        <option value="class-1">Class 1</option>
                        <option value="class-2">Class 2</option>
                        <option value="class-3">Class 3</option>
                        <option value="class-4">Class 4</option>
                        <option value="class-5">Class 5</option>
                        <option value="class-6">Class 6</option>
                        <option value="class-7">Class 7</option>
                        <option value="class-8">Class 8</option>
                        <option value="class-9">Class 9</option>
                        <option value="class-10">Class 10</option>
                        <option value="class-11">Class 11</option>
                        <option value="class-12">Class 12</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="section">Section</label>
                    <select id="section" name="section" required>
                        <option value="">Select Section</option>
                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                        <option value="C">Section C</option>
                        <option value="D">Section D</option>
                    </select>
                </div>
                
                <button type="submit" class="login-btn">
                    <span class="btn-text">Login</span>
                    <span class="btn-loading" style="display: none;">
                        <span class="spinner"></span>
                        Logging in...
                    </span>
                </button>
                
                <div class="error-message" id="errorMessage" style="display: none;"></div>
            </form>
            
            <div class="login-footer">
                <p>Are you a teacher? <a href="teacher-login.html">Teacher Login</a></p>
                <div class="demo-info">
                    <p>Demo Mode: Use any credentials to login</p>
                </div>
            </div>
        </div>
    </div>


    <script src="student-login.js"></script>
    <script src="script.js"></script>
    <script>
      async function handleLogin(event) {
          event.preventDefault();
          const username = document.getElementById("studentId").value;
          const password = document.getElementById("password").value;

          const result = await studentLogin(username, password);

          if (result.success) {
              alert("Login successful!");
              window.location.href = "student-dashboard.html";
          } else {
              alert("Login failed: " + result.message);
          }
      }
      document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>

</body>
</html>
