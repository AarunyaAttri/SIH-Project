<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Login - Attendance System</title>
    <link rel="stylesheet" href="parents-login.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; }
        .login-container { max-width: 400px; margin: 60px auto; background: #18181b; border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); padding: 40px 32px; color: #fff; }
        .login-header h1 { text-align: center; font-size: 2.2em; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .login-header p { text-align: center; color: #e0e7ff; margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; color: #fff; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px; border-radius: 14px; border: none; background: #eaf0ff; font-size: 1.1em; color: #222; margin-bottom: 10px; }
        .otp-row { display: flex; gap: 10px; align-items: center; }
        .otp-btn { background: #6366f1; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .otp-btn:hover { background: #4338ca; }
        .login-btn { width: 100%; background: #ff6b6b; color: #222; font-size: 1.2em; font-weight: 500; border: none; border-radius: 12px; padding: 14px 0; margin-top: 12px; cursor: pointer; transition: background 0.2s; }
        .login-btn:hover { background: #ff4c4c; }
        .agreement-row { display: flex; align-items: center; margin-bottom: 10px; }
        .agreement-row label { color: #fff; font-size: 1em; margin-left: 8px; }
        .error-message { color: #ff6b6b; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="whoami.html" style="display:inline-block; margin-bottom: 24px; padding: 10px 28px; border:2px solid #fff; border-radius: 32px; color:#fff; background:none; font-size:1.2em; font-weight:500; text-decoration:none; transition:background 0.2s;">&lt;&lt; BACK</a>
        <div class="login-header">
            <h1>Parent Login</h1>
            <p>Attendance Management System</p>
        </div>
        <form id="parentLoginForm" autocomplete="off">
            <div class="form-group">
                <label for="phone">Registered Phone Number</label>
                <div class="otp-row">
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                    <button type="button" class="otp-btn" id="generateOtpBtn">Generate OTP</button>
                </div>
            </div>
            <div class="form-group">
                <label for="otp">Enter OTP</label>
                <input type="text" id="otp" name="otp" placeholder="Enter OTP" required>
            </div>
            <div class="agreement-row">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>
    <script>
    document.getElementById('generateOtpBtn').onclick = function() {
        alert('OTP sent to your registered phone number. (Demo only)');
    };
    document.getElementById('parentLoginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var phone = document.getElementById('phone').value.trim();
        var otp = document.getElementById('otp').value.trim();
        var terms = document.getElementById('terms').checked;
        var errorMsg = document.getElementById('errorMessage');
        errorMsg.style.display = 'none';
        if (!phone) {
            errorMsg.textContent = 'Please enter your registered phone number.';
            errorMsg.style.display = 'block';
            return;
        }
        if (!otp) {
            errorMsg.textContent = 'Please enter the OTP.';
            errorMsg.style.display = 'block';
            return;
        }
        if (!terms) {
            errorMsg.textContent = 'You must agree to the Terms of Service and Privacy Policy to login.';
            errorMsg.style.display = 'block';
            return;
        }
        window.location.href = 'parent-dashboard.html';
    });
    </script>
</body>
</html>
