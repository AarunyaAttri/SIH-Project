<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Attendance System</title>
    <link rel="stylesheet" href="teacher-login.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: url('homepageimage.png') no-repeat center center fixed;
            background-size: cover;
        }
        .login-container {
            max-width: 600px;
            margin: 60px auto;
            background: rgba(20,20,20,0.95);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding: 40px 32px;
            position: relative;
            z-index: 1;
        }
        .login-header h1 {
            text-align: center;
            font-size: 2.8em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .login-header p {
            text-align: center;
            color: #e0e7ff;
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: #eaf0ff;
            font-size: 1.2em;
            color: #222;
        }
        .login-btn {
            width: 100%;
            background: #ff6b6b;
            color: #222;
            font-size: 1.4em;
            font-weight: 500;
            border: none;
            border-radius: 14px;
            padding: 18px 0;
            margin-top: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #ff4c4c;
        }
        .login-footer {
            margin-top: 32px;
            text-align: center;
            color: #e0e7ff;
        }
        .login-footer a {
            color: #6366f1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="whoami.html" style="display:inline-block; margin-bottom: 24px; padding: 10px 28px; border:2px solid #fff; border-radius: 32px; color:#fff; background:none; font-size:1.2em; font-weight:500; text-decoration:none; transition:background 0.2s;">&lt;&lt; BACK</a>
        <div class="login-header">
            <h1>Teacher Login</h1>
            <p>Attendance Management System</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="teacherId">Teacher ID</label>
                <input type="text" id="teacherId" name="teacherId" placeholder="Enter your Teacher ID" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div style="margin-bottom:18px; display:flex; align-items:center;">
                <input type="checkbox" id="terms" name="terms" style="margin-right:8px;">
                <label for="terms" style="color:#fff; font-size:1em;">I agree to the Terms of Service and Privacy Policy</label>
                <a href="#" style="margin-left:auto; color:#6366f1; font-size:1em; text-decoration:underline;">Forgot Password?</a>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>
    <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!document.getElementById('terms').checked) {
            alert('You must agree to the Terms of Service and Privacy Policy to login.');
            return;
        }
        window.location.href = 'teachers-dashboard.html';
    });
    </script>
</body>
</html>
